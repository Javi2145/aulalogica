<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AulaLógica Web · Acceso</title>
<link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<section id="auth" class="scr on">
  <div class="form">
    <div class="tabs">
      <form th:action="@{/acceso}" method="get" style="display:contents">
        <button id="tr" name="modo" value="reg" th:classappend="${modo == 'reg'} ? 'act'">Registrarme</button>
        <button id="tl" name="modo" value="log" th:classappend="${modo == 'log'} ? 'act'">Iniciar sesión</button>
      </form>
    </div>
    <form th:action="@{/acceso}" method="post" novalidate style="display:contents">
      <input type="hidden" name="modo" th:value="${modo}">
      <div class="field" id="fn" th:if="${modo == 'reg'}"><svg viewBox="0 0 16 16"><path d="M8 8a3 3 0 100-6 3 3 0 000 6zm-5 6s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1H3z"/></svg><input id="rn" name="nombre" placeholder="Nombre" aria-label="Nombre" autocomplete="name" th:value="${nombre}"></div>
      <div class="field"><svg viewBox="0 0 16 16"><path d="M13.1 3H2.9A1.9 1.9 0 001 4.9v6.2A1.9 1.9 0 002.9 13h10.2a1.9 1.9 0 001.9-1.9V4.9A1.9 1.9 0 0013.1 3zM8 8.4L2.6 5h10.8L8 8.4z"/></svg><input id="re" name="correo" type="email" placeholder="Correo" aria-label="Correo" autocomplete="email" th:value="${correo}"></div>
      <div class="field"><svg viewBox="0 0 16 16"><path d="M8 1a3 3 0 00-3 3v2H4a1 1 0 00-1 1v6a1 1 0 001 1h8a1 1 0 001-1V7a1 1 0 00-1-1h-1V4a3 3 0 00-3-3zm-1.500 3a1.500 1.500 0 013 0v2h-3V4z"/></svg><input id="rp" name="clave" type="password" placeholder="Contraseña (mínimo 6)" aria-label="Contraseña"></div>
      <p class="msg" id="rm" role="alert" th:text="${mensaje}"></p>
      <div class="btnrow"><button class="b1" id="ab" type="submit" th:text="${modo == 'reg'} ? 'Registrarme' : 'Entrar'">Registrarme</button><a class="b2" th:href="@{/}">Volver</a></div>
    </form>
    <form th:action="@{/invitado}" method="post" style="display:contents"><button class="b3" type="submit">Entrar como invitado</button></form>
  </div>
</section>
</body>
</html>

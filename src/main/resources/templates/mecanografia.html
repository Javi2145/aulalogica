<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/base :: layout('Mecanografía','tec',~{::main})}">
<body>
<main>
  <div class="view on" id="v-tec">
    <h2 class="t">Mecanografía</h2>
    <div class="card" id="tmenu"><div class="tools"><span class="box red"></span><span class="box yellow"></span><span class="box green"></span><span class="tl">Elige un nivel · supera con 90 % de precisión</span></div><div class="body"><div class="grid" id="tlv">
      <th:block th:each="t, st : ${niveles}">
        <a th:if="${usuario.nivelAbierto(st.index)}" class="card hv" th:href="@{/mecanografia/{n}(n=${st.index})}"><div class="body"><h3 th:text="'Nivel ' + ${st.count} + (${usuario.nivelSuperado(st.index)} ? ' ✔' : '')">Nivel</h3><p th:text="${usuario.teclado.containsKey(st.index)} ? ('Mejor puntaje: ' + ${usuario.teclado.get(st.index).puntaje} + ' · ' + ${usuario.teclado.get(st.index).precision} + ' %') : 'Sin intentos'">Sin intentos</p></div></a>
        <div th:unless="${usuario.nivelAbierto(st.index)}" class="card lock"><div class="body"><h3 th:text="'Nivel ' + ${st.count}">Nivel</h3><p th:text="'Bloqueado: supera el nivel ' + ${st.index}">Bloqueado</p></div></div>
      </th:block>
    </div></div></div>
  </div>
</main>
</body>
</html>

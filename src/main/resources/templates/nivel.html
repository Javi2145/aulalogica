<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/base :: layout('Mecanografía','tec',~{::main})}">
<body>
<main>
  <div class="view on" id="v-tec">
    <h2 class="t">Mecanografía</h2>
    <div class="card win" id="tplay" th:data-texto="${texto}" th:data-nivel="${nivel}" th:data-haymas="${hayMas}"
         th:data-url="@{/mecanografia/{n}/resultado(n=${nivel})}" th:data-sig="@{/mecanografia/{n}(n=${nivel + 1})}"
         th:data-menu="@{/mecanografia}" th:data-este="@{/mecanografia/{n}(n=${nivel})}">
      <div class="tools"><span class="box red"></span><span class="box yellow"></span><span class="box green"></span><span class="tl" th:text="'Nivel ' + ${nivel + 1} + ' de ' + ${niveles.size()}">Nivel</span></div>
      <div class="body">
        <div id="ttext" aria-live="off"></div>
        <div class="stats" id="tst"></div>
        <div class="fb" id="tfb" aria-live="polite">Empieza a escribir. Verde = acierto, rojo = error.</div>
        <div class="kb" id="kb"></div>
        <div class="nav" id="tnav"></div>
      </div>
    </div>
  </div>
  <script th:src="@{/js/teclado.js}"></script>
</main>
</body>
</html>

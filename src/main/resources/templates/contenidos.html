<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/base :: layout('Contenidos','cont',~{::main})}">
<body>
<main>
  <div class="view on" id="v-cont">
    <h2 class="t" id="hi" th:text="'Hola, ' + ${usuario.nombre} + '. Elige un tema'">Contenidos</h2>
    <div class="jvbar"><span class="jv">JAVA</span><span>Lecciones de programación en Java</span></div>
    <nav class="ruta" aria-label="Recorrido sugerido">
      <span>Recorrido:</span>
      <ol>
        <li>Lee la lección</li>
        <li>Estudia el ejemplo resuelto</li>
        <li><a th:href="@{/practica}">Practica en Java</a></li>
        <li><a th:href="@{/evaluaciones}">Evalúate</a></li>
        <li><a th:href="@{/glosario}">Consulta el glosario</a></li>
      </ol>
    </nav>
    <div class="grid" id="mods">
      <th:block th:each="t, st : ${temas}">
        <a th:if="${visibles.contains(st.index)}" class="card hv" th:href="@{/leccion/{n}(n=${st.index})}" th:style="'--a:' + ${colores[st.index % 6]}" th:attr="data-t=${t.clave()}"><div class="tools"><span class="box red"></span><span class="box yellow"></span><span class="box green"></span><span class="tl" th:if="${usuario.leccionHecha(st.index)}">✔ completado</span><span class="jv">JAVA</span></div><div class="body"><h3 th:text="${t.titulo}">Tema</h3><p th:text="${t.subtitulo}">Subtítulo</p></div></a>
      </th:block>
    </div>
    <p id="sinTemas" th:style="${visibles.isEmpty()} ? 'color:var(--mut)' : 'color:var(--mut);display:none'">No hay temas con esa palabra. Prueba con “ciclos” o “arreglos”.</p>
  </div>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/base :: layout('Evaluación','eval',~{::main})}">
<body>
<main>
  <div class="view on" id="v-eval">
    <h2 class="t">Evaluaciones</h2>
    <div class="card win" id="ev">
      <div class="tools"><span class="box red"></span><span class="box yellow"></span><span class="box green"></span><span class="tl" th:text="${evaluacion.titulo}">Evaluación</span><span class="jv">JAVA</span></div>
      <div class="body">
        <h3 th:text="'Pregunta ' + ${q + 1} + ' de ' + ${total}">Pregunta</h3>
        <div class="bar"><i th:style="'width:' + ${q * 100.0 / total} + '%'"></i></div>
        <p th:text="${pregunta.enunciado}">Enunciado</p>
        <div class="opts">
          <form th:action="@{/evaluacion/{e}/pregunta/{q}/elegir(e=${e},q=${q})}" method="post" style="display:contents">
            <button th:each="o, k : ${pregunta.opciones}" type="submit" name="opcion" th:value="${k.index}" class="opt" th:classappend="${respuestas[q] != null and respuestas[q] == k.index} ? 'sel'" th:text="${o}">Opción</button>
          </form>
        </div>
        <div class="dots"><span th:each="r, st : ${respuestas}" th:classappend="(${st.index == q} ? 'cur ' : '') + (${r != null} ? 'done' : '')" th:text="${st.count}">1</span></div>
        <div class="fb" id="efb" aria-live="polite" th:text="${mensaje}">Elige una opción y pulsa “Enviar respuesta”.</div>
        <form th:action="@{/evaluacion/{e}/pregunta/{q}/enviar(e=${e},q=${q})}" method="post"><button class="go" type="submit">Enviar respuesta</button></form>
        <div class="nav"><form th:action="@{/evaluacion/{e}/resultado(e=${e})}" method="get" style="display:contents" th:data-faltan="${faltan}"><button>Finalizar</button></form></div>
      </div>
    </div>
  </div>
</main>
</body>
</html>

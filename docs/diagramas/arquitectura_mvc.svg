   <g id="text_17">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f2a44" x="360" y="274.818145" transform="rotate(-0 360 274.818145)">El navegador envía un dato → el controlador lo recibe → el servicio lo valida y calcula → el modelo guarda el resultado → Thymeleaf muestra la retroalimentación</text>
